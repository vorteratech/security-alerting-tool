# Security Alerting Tool - TrueNAS Self-Contained Deploy
#
# USAGE:
# 1. Copy this entire project folder to TrueNAS: /mnt/YOURPOOL/appdata/securityalerting/
# 2. In TrueNAS, create a Custom App with this compose file
#    OR run: cd /mnt/YOURPOOL/appdata/securityalerting && docker-compose -f truenas-docker-compose.yml up -d

version: '3.8'

services:
  securityalerting:
    build:
      context: .
      dockerfile: Dockerfile
    image: securityalerting:latest
    container_name: securityalerting
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-}
      - S1_WEBHOOK_SECRET=${S1_WEBHOOK_SECRET:-}
      - CS_WEBHOOK_SECRET=${CS_WEBHOOK_SECRET:-}
      - TEAMS_BOT_APP_ID=${TEAMS_BOT_APP_ID:-}
      - TEAMS_BOT_APP_SECRET=${TEAMS_BOT_APP_SECRET:-}
      - ACTION_CALLBACK_URL=${ACTION_CALLBACK_URL:-http://localhost:8000/api/v1/actions}
      - TZ=${TZ:-UTC}
    volumes:
      - securityalerting-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  securityalerting-data:
