# Security Alerting Tool - TrueNAS Simple Deploy
#
# This version uses a pre-built image approach that works better with TrueNAS
#
# STEP 1: Build the image first (one-time, in TrueNAS shell):
#   cd /mnt/YOUR_POOL/appdata
#   git clone https://github.com/vorteratech/security-alerting-tool.git
#   cd security-alerting-tool
#   docker build -t securityalerting:latest .
#
# STEP 2: Then deploy this compose file

version: '3.8'

services:
  securityalerting:
    image: securityalerting:latest
    container_name: securityalerting
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-}
      - S1_WEBHOOK_SECRET=${S1_WEBHOOK_SECRET:-}
      - CS_WEBHOOK_SECRET=${CS_WEBHOOK_SECRET:-}
      - TEAMS_BOT_APP_ID=${TEAMS_BOT_APP_ID:-}
      - TEAMS_BOT_APP_SECRET=${TEAMS_BOT_APP_SECRET:-}
      - ACTION_CALLBACK_URL=${ACTION_CALLBACK_URL:-http://localhost:8000/api/v1/actions}
      - TZ=${TZ:-UTC}
    volumes:
      - securityalerting-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  securityalerting-data:
