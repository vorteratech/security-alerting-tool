# Security Alerting Tool - TrueNAS One-Click Deploy
# Just paste this YAML into TrueNAS Custom App and deploy!

version: '3.8'

services:
  securityalerting:
    image: python:3.11-slim
    container_name: securityalerting
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-}
      - TZ=${TZ:-UTC}
    volumes:
      - securityalerting-data:/app/data
      - securityalerting-src:/app/src
    working_dir: /app
    command: >
      bash -c "
        set -e

        # Install git and curl
        apt-get update && apt-get install -y --no-install-recommends git curl && rm -rf /var/lib/apt/lists/*

        # Clone or update repo
        if [ ! -f /app/src/.installed ]; then
          echo 'Cloning repository...'
          git clone https://github.com/vorteratech/security-alerting-tool.git /app/src
          cd /app/src
          pip install --no-cache-dir -r requirements.txt
          touch /app/src/.installed
        else
          echo 'Updating from repository...'
          cd /app/src
          git fetch origin && git reset --hard origin/main || echo 'Git update failed, using cached version'
        fi

        # Generate encryption key if not set
        if [ -z \"$$MASTER_ENCRYPTION_KEY\" ]; then
          if [ -f /app/data/.encryption_key ]; then
            export MASTER_ENCRYPTION_KEY=$$(cat /app/data/.encryption_key)
            echo 'Loaded encryption key from storage'
          else
            export MASTER_ENCRYPTION_KEY=$$(python3 -c 'import secrets; print(secrets.token_hex(32))')
            echo \"$$MASTER_ENCRYPTION_KEY\" > /app/data/.encryption_key
            chmod 600 /app/data/.encryption_key
            echo 'Generated new encryption key - saved to /app/data/.encryption_key'
          fi
        fi

        echo \"Encryption key loaded: $${MASTER_ENCRYPTION_KEY:0:8}...\"

        # Start the app with the encryption key in environment
        cd /app/src
        exec env MASTER_ENCRYPTION_KEY=\"$$MASTER_ENCRYPTION_KEY\" python -m uvicorn src.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  securityalerting-data:
  securityalerting-src:
