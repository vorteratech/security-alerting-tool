# Security Alerting Tool - Docker Compose
#
# Usage:
#   Production: docker-compose up -d
#   Development: docker-compose --profile dev up
#
# Before starting, create a .env file with your secrets (see .env.example)

version: '3.8'

services:
  security-alerting:
    build:
      context: .
      target: production
    container_name: security-alerting-tool
    ports:
      - "8000:8000"
    environment:
      # ============================================================
      # SET YOUR WEB UI PASSWORD HERE
      # ============================================================
      - APP_PASSWORD=${APP_PASSWORD:-CHANGE_ME}

      # REQUIRED: Master encryption key (64-character hex)
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}

      # EDR Webhook secrets
      - S1_WEBHOOK_SECRET=${S1_WEBHOOK_SECRET:-}
      - CS_WEBHOOK_SECRET=${CS_WEBHOOK_SECRET:-}

      # Teams Bot credentials (from Azure Bot registration)
      - TEAMS_BOT_APP_ID=${TEAMS_BOT_APP_ID:-}
      - TEAMS_BOT_APP_SECRET=${TEAMS_BOT_APP_SECRET:-}

      # Action callback URL (your public-facing URL for Teams buttons)
      - ACTION_CALLBACK_URL=${ACTION_CALLBACK_URL:-http://localhost:8000/api/v1/actions}
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Mount config file
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - alerting-net

  # Development mode with auto-reload
  security-alerting-dev:
    build:
      context: .
      target: production
    container_name: security-alerting-dev
    ports:
      - "8000:8000"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-CHANGE_ME}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - S1_WEBHOOK_SECRET=${S1_WEBHOOK_SECRET:-}
      - CS_WEBHOOK_SECRET=${CS_WEBHOOK_SECRET:-}
      - TEAMS_BOT_APP_ID=${TEAMS_BOT_APP_ID:-}
      - TEAMS_BOT_APP_SECRET=${TEAMS_BOT_APP_SECRET:-}
      - ACTION_CALLBACK_URL=${ACTION_CALLBACK_URL:-http://localhost:8000/api/v1/actions}
    volumes:
      # Mount source for hot reload
      - ./src:/app/src:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev
    networks:
      - alerting-net

networks:
  alerting-net:
    driver: bridge
