# Security Alerting Tool - Configuration
#
# This file contains non-sensitive configuration settings.
# Sensitive values (API keys, secrets) should be set via environment variables.
#
# NOTE: Set APP_PASSWORD environment variable in your deployment (docker-compose, TrueNAS, etc.)

security:
  verify_webhooks: true
  encryption_key_env: "MASTER_ENCRYPTION_KEY"

server:
  host: "0.0.0.0"
  port: 8000
  debug: false

logging:
  level: "INFO"
  format: "text"

database:
  path: "./data/settings.db"

defaults:
  ai_provider: "claude"
  threat_intel_providers:
    - "virustotal"
    - "alienvault"
